name: Release

# 推送 v* 标签时自动构建安装包并发布到 GitHub Releases（如：git tag v0.1.0 && git push --tags）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 重编译原生模块（better-sqlite3 适配 Electron）
        run: npm run rebuild

      - name: 构建并发布（Windows x64 NSIS）
        if: matrix.os == 'windows-latest'
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布（macOS dmg arm64/x64）
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 清理本地配置并同步移动端页面
        run: |
          rm -f android-app/local.properties
          cp -f mobile/index.html android-app/app/src/main/assets/www/index.html

      - name: 构建 APK（debug 签名，可直接安装）
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: 发布 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          name: CSPAPER v0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
