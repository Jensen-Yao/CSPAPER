// 仓库顺序：GitHub 海外运行器直连 google() / mavenCentral()；国内本地构建可设置 CSPAPER_CN_MIRROR=1 优先走阿里云镜像
def cnMirror = System.getenv('CSPAPER_CN_MIRROR') == '1'
def addRepositories = { repos ->
    if (cnMirror) {
        repos.maven { url 'https://maven.aliyun.com/repository/google' }
        repos.maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        repos.maven { url 'https://maven.aliyun.com/repository/public' }
    }
    repos.google()
    repos.mavenCentral()
    repos.gradlePluginPortal()
}
pluginManagement {
    repositories {
        addRepositories(delegate)
    }
}
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        addRepositories(delegate)
    }
}
rootProject.name = "CSPAPER"
include ':app'
